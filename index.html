<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全台房仲門店聯絡資訊｜公開版</title>
<meta name="description" content="全台房仲門店公開營業資訊彙整：品牌、門店、市話、地址與官方門店頁。">
<meta property="og:title" content="全台房仲門店聯絡資訊｜公開版">
<meta property="og:description" content="614 間房仲門店的公開營業資訊，涵蓋 21 個縣市、6 個品牌。">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211c;--muted:#61726a;--line:#e2e8e4;--accent:#2f6f4e;--accent-soft:#e8f2ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased}
header{background:linear-gradient(135deg,#1d3d2e,#2f6f4e 60%,#3d8a63);color:#fff;padding:28px 32px 26px}
header h1{margin:0;font-size:26px;letter-spacing:.5px}
header p{margin:8px 0 0;opacity:.85;font-size:13.5px;line-height:1.7}
.wrap{max-width:1400px;margin:0 auto;padding:22px 24px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:-34px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 6px 18px rgba(22,33,28,.06)}
.kpi .n{font-size:27px;font-weight:700;color:var(--accent);line-height:1.2}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:5px}
.panels{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:22px}
@media(max-width:900px){.panels{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.panel h2{margin:0 0 14px;font-size:15px;letter-spacing:.3px}
.panel h2 span{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.bar{display:grid;grid-template-columns:64px 1fr 40px;align-items:center;gap:10px;margin-bottom:7px;font-size:12.5px}
.bar .t{color:var(--muted);text-align:right}
.bar .track{background:#eef2ef;border-radius:6px;height:16px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--accent);transition:width .3s}
.bar .v{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:24px 0 12px}
select,input[type=search]{padding:9px 12px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);font-size:13.5px;color:var(--ink);outline:none}
select:focus,input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:240px;flex:1;max-width:360px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.btn{padding:9px 15px;border-radius:9px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--accent)}
.cnt{font-size:13px;color:var(--muted);margin-left:auto}
.tablebox{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#f0f4f1;text-align:left;padding:11px 12px;font-weight:600;
  color:#41544a;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
thead th:hover{background:#e7eee9}
tbody td{padding:10px 12px;border-bottom:1px solid #eef1ef;vertical-align:top}
tbody tr:hover{background:#f8fbf9}
.brand{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;white-space:nowrap}
.tel{color:var(--accent);text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.tel:hover{text-decoration:underline}
.sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.links a{color:#3a5f8a;text-decoration:none;font-size:12px;margin-right:10px;white-space:nowrap}
.links a:hover{text-decoration:underline}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dot{width:6px;height:6px;border-radius:50%;background:#dbe3de}
.dot.on{background:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.9}
.note{background:#fffdf3;border:1px solid #f0e6c8;border-radius:12px;padding:14px 16px;
  font-size:12.5px;color:#7a6a3d;line-height:1.85;margin-top:18px}
h3.sect{margin:30px 0 12px;font-size:15px}
</style>
</head>
<body>
<header>
  <h1>全台房仲門店聯絡資訊</h1>
  <p>公開營業資訊彙整 ・ 資料來源：品牌官網服務據點、地方不動產仲介經紀商業同業公會會員名錄<br>
     查證日期 2026-11-11 ・ 本頁不包含個人姓名、手機或私人社群帳號</p>
</header>

<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <div class="panels">
    <div class="panel">
      <h2>各縣市門店數 <span>依筆數排序</span></h2>
      <div id="cityChart"></div>
    </div>
    <div class="panel">
      <h2>各品牌門店數 <span>可點擊篩選</span></h2>
      <div id="brandChart"></div>
    </div>
  </div>

  <div class="toolbar">
    <select id="fCity"></select>
    <select id="fBrand"></select>
    <input type="search" id="q" placeholder="搜尋門店／地址／電話">
    <label class="chk"><input type="checkbox" id="fSoc"> 只看有粉專</label>
    <button class="btn ghost" id="reset">重設</button>
    <button class="btn" id="export">匯出篩選結果 CSV</button>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="tablebox">
    <div class="scroll">
      <table>
        <thead><tr>
          <th data-k="0">縣市</th><th data-k="1">品牌</th><th data-k="2">門店名稱</th>
          <th data-k="3">市話</th><th data-k="4">地址</th><th data-k="5">連結</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" style="display:none">沒有符合條件的門店</div>
  </div>

  <div class="note" id="note"></div>

  <h3 class="sect">品牌總部／加盟窗口</h3>
  <div class="tablebox">
    <div class="scroll" style="max-height:none">
      <table>
        <thead><tr><th>品牌</th><th>總部類型</th><th>窗口職能</th><th>公開電話</th><th>總部地址</th><th>官方窗口頁</th></tr></thead>
        <tbody id="hqbody"></tbody>
      </table>
    </div>
  </div>

  <footer>
    本頁僅彙整各品牌官網與公會名錄已公開之營業用資訊，供商業合作洽詢參考；資料可能隨門店調整而變動，請以官方頁面為準。<br>
    若你是名單中的業者並希望調整或移除資料，請提出，我們會儘速處理。
  </footer>
</div>

const HQ = [["永慶房屋", "直營總部", "客服／加盟洽詢", "0800-661111", "台北市大安區敦化南路二段77號12樓", "https://www.yungching.com.tw/"], ["永慶不動產", "加盟總部", "加盟洽詢", "0800-306888", "台北市大安區敦化南路二段77號12樓", "https://www.yungching.com.tw/"], ["住商不動產", "加盟總部", "總公司代表號", "0800-212-306", "台北市大安區敦化南路二段267號3樓之2", "https://www.hbhousing.com.tw/franchise"], ["21世紀不動產", "加盟總部", "加盟諮詢", "0800-021-166", "", "https://join21.com.tw/"], ["台灣房屋", "加盟總部", "台北加盟總部", "02-8797-3222", "桃園市桃園區經國路857號12樓", "https://www.twhg.com.tw/jointwhg.php"], ["東森房屋", "加盟總部", "加盟諮詢專線", "02-2388-5959", "台北市中正區館前路42號4樓", "https://www.etwarm.com.tw/company/business"], ["有巢氏房屋", "加盟總部", "加盟洽詢", "0809-011-811", "", "https://www.u-trust.com.tw/CB2/CB01.asp"], ["信義房屋", "直營總部", "客服", "0800-211-922", "台北市信義區信義路五段100號", "https://www.sinyi.com.tw/"]];
const DAY = "2026-11-11";

const CITY_ORDER = ["台北市","新北市","桃園市","台中市","台南市","高雄市","基隆市","新竹市","新竹縣","苗栗縣","彰化縣","南投縣","雲林縣","嘉義市","嘉義縣","屏東縣","宜蘭縣","花蓮縣","台東縣","澎湖縣","金門縣","連江縣"];
const BRAND_COLOR = {"住商不動產":"#2e7d32","台灣房屋":"#1f6feb","東森房屋":"#d64541",
  "有巢氏房屋":"#e07b39","21世紀不動產":"#b8860b","大家房屋":"#7b4dbf"};
const colorOf = b => BRAND_COLOR[b] || "#5c7a6a";
const cityIdx = c => { const i = CITY_ORDER.indexOf(c); return i < 0 ? 99 : i; };

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}

DATA.sort((a,b)=>{
  const d = cityIdx(a[0]) - cityIdx(b[0]);
  if(d) return d;
  const s = (b[6]?1:0)-(a[6]?1:0);
  if(s) return s;
  return a[2].localeCompare(b[2],"zh-Hant");
});

const total = DATA.length;
const withTel = DATA.filter(r=>r[3]).length;
const cities = new Set(DATA.map(r=>r[0])).size;
const brands = new Set(DATA.map(r=>r[1])).size;
const withPage = DATA.filter(r=>r[5]).length;
[[total,"門店總筆數"],[withTel,"有市話"],[withPage,"有官方門店頁"],
 [cities,"涵蓋縣市"],[brands,"品牌數"]].forEach(([n,l])=>{
  document.getElementById("kpis").appendChild(
    el("div","kpi",`<div class="n">${n}</div><div class="l">${l}</div>`));
});

function bars(container, pairs, colorFn, onClick){
  const max = Math.max(...pairs.map(p=>p[1]),1);
  container.innerHTML="";
  pairs.forEach(([name,val])=>{
    const row = el("div","bar");
    row.innerHTML = `<div class="t" title="${name}">${name}</div>
      <div class="track"><div class="fill" style="width:${(val/max*100).toFixed(1)}%;${colorFn?`background:${colorFn(name)}`:""}"></div></div>
      <div class="v">${val}</div>`;
    if(onClick){row.style.cursor="pointer"; row.onclick=()=>onClick(name);}
    container.appendChild(row);
  });
}

const cityCount = {};
DATA.forEach(r=>cityCount[r[0]]=(cityCount[r[0]]||0)+1);
bars(document.getElementById("cityChart"),
     Object.entries(cityCount).sort((a,b)=>b[1]-a[1]), null,
     name=>{document.getElementById("fCity").value=name; render();});

const brandCount = {};
DATA.forEach(r=>brandCount[r[1]]=(brandCount[r[1]]||0)+1);
const brandPairs = Object.entries(brandCount).sort((a,b)=>b[1]-a[1]);
bars(document.getElementById("brandChart"), brandPairs, colorOf,
     name=>{document.getElementById("fBrand").value=name; render();});

const fCity=document.getElementById("fCity"), fBrand=document.getElementById("fBrand"),
      q=document.getElementById("q"), fSoc=document.getElementById("fSoc"),
      tbody=document.getElementById("tbody"), cnt=document.getElementById("cnt"),
      empty=document.getElementById("empty");

["全部縣市",...CITY_ORDER.filter(c=>cityCount[c])].forEach(c=>{
  const o=document.createElement("option"); o.value=c==="全部縣市"?"":c; o.textContent=c; fCity.appendChild(o);});
["全部品牌",...brandPairs.map(p=>p[0])].forEach(b=>{
  const o=document.createElement("option"); o.value=b==="全部品牌"?"":b; o.textContent=b; fBrand.appendChild(o);});

let sortKey=null, sortAsc=true;

function currentRows(){
  const city=fCity.value, brand=fBrand.value, term=q.value.trim().toLowerCase();
  let out = DATA.filter(r=>{
    if(city && r[0]!==city) return false;
    if(brand && r[1]!==brand) return false;
    if(fSoc.checked && !r[6]) return false;
    if(term){
      const hay=(r[0]+r[1]+r[2]+r[3]+r[4]).toLowerCase();
      if(!hay.includes(term)) return false;
    }
    return true;
  });
  if(sortKey!==null){
    out.sort((a,b)=>{
      const x=(a[sortKey]||"").toString(), y=(b[sortKey]||"").toString();
      return sortAsc? x.localeCompare(y,"zh-Hant") : y.localeCompare(x,"zh-Hant");
    });
  }
  return out;
}

function render(){
  const rows=currentRows();
  cnt.textContent = `顯示 ${rows.length} / ${total} 筆`;
  empty.style.display = rows.length? "none":"block";
  const frag=document.createDocumentFragment();
  rows.forEach(r=>{
    const tr=document.createElement("tr");
    const dots=`<span class="dots">
        <span class="dot ${r[3]?'on':''}" title="市話"></span>
        <span class="dot ${r[4]?'on':''}" title="地址"></span>
        <span class="dot ${r[5]?'on':''}" title="官方頁"></span></span>`;
    const links=[];
    if(r[5]) links.push(`<a href="${r[5]}" target="_blank" rel="noopener nofollow">官方門店頁</a>`);
    if(r[6]) r[6].split(/\s+/).filter(Boolean).forEach(u=>{
      links.push(`<a href="${u}" target="_blank" rel="noopener nofollow">${u.includes("instagram")?"IG":"FB"}</a>`);
    });
    tr.innerHTML =
      `<td>${r[0]}</td>
       <td><span class="brand" style="background:${colorOf(r[1])}1a;color:${colorOf(r[1])}">${r[1]}</span></td>
       <td>${r[2]}${dots}${r[7]?`<div class="sub">${r[7]}</div>`:""}</td>
       <td>${r[3]?`<a class="tel" href="tel:${r[3].replace(/[^0-9+]/g,"")}">${r[3]}</a>`:'<span class="sub">—</span>'}</td>
       <td>${r[4]}</td>
       <td class="links">${links.join("")||'<span class="sub">—</span>'}</td>`;
    frag.appendChild(tr);
  });
  tbody.innerHTML="";
  tbody.appendChild(frag);
  document.getElementById("note").innerHTML =
    `共彙整 ${total} 間門店，涵蓋 ${cities} 個縣市、${brands} 個品牌。本頁僅含門店層級營業資訊，不含個人姓名與手機。`;
}

document.querySelectorAll("thead th[data-k]").forEach(th=>{
  th.onclick=()=>{const k=+th.dataset.k;
    if(sortKey===k) sortAsc=!sortAsc; else {sortKey=k; sortAsc=true;}
    render();};
});
[fCity,fBrand,fSoc].forEach(e=>e.onchange=render);
q.oninput=render;
document.getElementById("reset").onclick=()=>{
  fCity.value="";fBrand.value="";q.value="";fSoc.checked=false;render();};

document.getElementById("export").onclick=()=>{
  const rows=currentRows();
  const head=["縣市","品牌","門店名稱","市話","地址","官方門店頁","FB/IG","備註"];
  const esc=s=>`"${String(s??"").replace(/"/g,'""')}"`;
  const csv="\ufeff"+[head.map(esc).join(",")]
    .concat(rows.map(r=>r.map(esc).join(","))).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`房仲門店_${rows.length}筆_${DAY}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

const hqbody=document.getElementById("hqbody");
HQ.forEach(r=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td><span class="brand" style="background:${colorOf(r[0])}1a;color:${colorOf(r[0])}">${r[0]}</span></td>
    <td>${r[1]}</td><td>${r[2]}</td>
    <td><a class="tel" href="tel:${r[3].replace(/[^0-9+]/g,"")}">${r[3]}</a></td>
    <td>${r[4]||'<span class="sub">—</span>'}</td>
    <td class="links"><a href="${r[5]}" target="_blank" rel="noopener nofollow">官方頁</a></td>`;
  hqbody.appendChild(tr);
});

render();
</script>
